
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kita Balikan? ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #c084fc);
            color: white;
        }

        #video-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            display: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(70, 0, 35, 0.3);
            z-index: -1;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 48px);
            margin-bottom: 35px;
            text-shadow: 0 3px 15px #9e174e;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #yes {
            color: #e91e63;
            background: white;
            box-shadow: 0 5px 20px #0003;
        }

        #yes:hover {
            transform: scale(1.12);
        }

        #no {
            color: white;
            background: #a855f7;
            position: relative;
        }

        #result {
            display: none;
            animation: appear 1s ease;
        }

        #result h1 {
            font-size: clamp(32px, 7vw, 58px);
            animation: heartbeat 1.2s infinite;
        }

        .heart {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            animation: floatUp linear forwards;
            z-index: 1;
        }

        .container > * {
            position: relative;
            z-index: 2;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <video id="video-bg" autoplay muted loop playsinline>
        <source src="static/love.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <main class="container">

        <div id="question">
            <h1>Kita balikan ya? ❤️🥺</h1>

            <div class="buttons">
                <button id="yes">Ya ❤️</button>
                <button id="no">Tidak 💔</button>
            </div>
        </div>

        <div id="result">
            <h1>Yeay kita balikan lopyu❤️❤️</h1>
        </div>

    </main>

    <script>
        const yes = document.getElementById("yes");
        const no = document.getElementById("no");
        const question = document.getElementById("question");
        const result = document.getElementById("result");
        const video = document.getElementById("video-bg");

        // Tombol Tidak berpindah-pindah
        function moveNoButton() {
            const padding = 20;

            const maxX = window.innerWidth - no.offsetWidth - padding;
            const maxY = window.innerHeight - no.offsetHeight - padding;

            const x = padding + Math.random() * Math.max(0, maxX - padding);
            const y = padding + Math.random() * Math.max(0, maxY - padding);

            no.style.position = "fixed";
            no.style.left = x + "px";
            no.style.top = y + "px";
            no.style.zIndex = "10";
        }

        // Saat kursor mendekat
        no.addEventListener("mouseenter", moveNoButton);

        // Saat disentuh di HP
        no.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveNoButton();
        }, { passive: false });

        // Jika berhasil diklik
        no.addEventListener("click", moveNoButton);

        // Saat tombol Ya ditekan
        yes.addEventListener("click", function() {
            question.style.display = "none";
            result.style.display = "block";

            video.style.display = "block";
            video.play().catch(() => {});

            document.querySelector(".overlay").style.background =
                "rgba(70, 0, 35, 0.25)";

            for (let i = 0; i < 70; i++) {
                setTimeout(createHeart, i * 100);
            }

            setInterval(createHeart, 250);
        });

        // Animasi hati berjatuhan
        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";

            heart.textContent = ["❤️", "💗", "💕", "💖", "💘", "💞"][
                Math.floor(Math.random() * 6)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (15 + Math.random() * 30) + "px";
            heart.style.animationDuration = (3 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 8500);
        }
    </script>

</body>
</html>
